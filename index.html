<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="profile-pic">
                <img src="Images/myphoto.jpg" alt="myphoto">
            </div>
        
            <div class="profile-details">
                <div class="intro">
                    <h2>Vennala Praveen</h2>
                    <h4>Frontend Developer</h4>
                    <div class="social">
                        <a href="#"><i class="fab fa-instagram" style="color:var(--light-pink);"></i></a>
                        <a href="#"><i class="fab fa-facebook" style="color:var(--blue);"></i></a>
                        <a href="#"><i class="fab fa-youtube" style="color:var(--dark-red);"></i></a>
                        <a href="#"><i class="fab fa-linkedin" style="color:var(--light-blue);"></i></a>
                    </div>
                </div>

                <div class="contact-info">
                    <div class="row">
                        <div class="icon">
                            <i class="fa fa-phone" style="color:var(--light-magenta);"></i>
                        </div>
                        <div class="content">
                            <span>Phone</span>
                            <h5>+91 9052485473</h5>
                        </div>
                    </div>

                    <div class="row">
                        <div class="icon">
                            <i class="fa fa-envelope-open" style="color:var(--light-green);"></i>
                        </div>
                        <div class="content">
                            <span>Email</span>
                            <h5>praveen98vennala@gmail.com</h5>
                        </div>
                    </div>

                    <div class="row">
                        <div class="icon">
                            <i class="fa fa-map-marker" style="color:var(--light-purple);"></i>
                        </div>
                        <div class="content">
                            <span>Location</span>
                            <h5>Visakhapatnam, Andhra Pradesh</h5>
                        </div>
                    </div>
                </div>
                    <button class="download-btn">Download CV</button>
            </div>
        </div>
    </div>

    
</body>
</html>
